[package]
name = "openharmony-ability"
workspace = "../.."
version = "1.0.0-beta.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Binding Rust application on Harmony with Ability"

[features]
default = ["log", "window"]
log = ["dep:log"]
window = ["dep:ohos-window-manager-binding"]

[dependencies]
# common dependencies
futures-channel = { workspace = true }
libloading = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
png = { workspace = true }

log = { version = "0.4", optional = true }

# for napi binding
napi-ohos = { workspace = true, features = ["napi8"] }
napi-derive-ohos = { workspace = true }

# for xcomponent native render
# 0.3.x's API-14 key enums/HTML helpers need its API-20 import gates.
# The keyboard delivery implementation itself calls only API-14 functions.
ohos-arkui-binding = { workspace = true, features = ["napi", "api-20"] }
ohos-xcomponent-binding = { workspace = true }
ohos-xcomponent-sys = { workspace = true }
ohos-arkui-sys = { workspace = true, features = ["api-14"] }
ohos-udmf-sys.workspace = true
ohos-ime-binding = { workspace = true }
ohos-display-binding = { workspace = true }
ohos-resource-manager-binding = { workspace = true }

# cursor-grab NDK FFI (re-exported from the `window` module); api-22 feature
# gates OH_WindowManager_LockCursor/UnlockCursor
ohos-window-manager-binding = { workspace = true, optional = true, features = ["api-22"] }
